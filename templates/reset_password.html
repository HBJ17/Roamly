{% extends 'base.html' %}

{% block title %}Set New Password - Roamly{% endblock %}

{% block content %}
<div class="card reveal-scroll" style="max-width: 480px; margin: 40px auto; padding:36px; border: 3px solid #000; box-shadow: 8px 8px 0px #000;">
    <div style="text-align:center; margin-bottom:24px;">
        <span class="badge badge-mint" style="margin-bottom:8px;">SECURITY KEY EXCHANGE</span>
        <h2 style="font-size:24px; margin:4px 0 6px;">Set New Password</h2>
        <p style="color:var(--text-secondary); font-size:13.5px; margin:0;">Create a strong new password for your Roamly account.</p>
    </div>

    <form action="{{ url_for('auth.reset_password', token=token) }}" method="POST">
        <div class="form-group mb-15">
            <label class="form-label" for="password">New Password (min 6 characters)</label>
            <input type="password" id="password" name="password" class="form-control" placeholder="Enter new password" minlength="6" required autofocus>
        </div>

        <div class="form-group mb-20">
            <label class="form-label" for="confirm_password">Confirm New Password</label>
            <input type="password" id="confirm_password" name="confirm_password" class="form-control" placeholder="Re-type new password" minlength="6" required>
        </div>

        <button type="submit" class="btn btn-primary" style="width:100%; padding:12px; font-size:14px;">
            Update &amp; Lock New Password →
        </button>
    </form>
</div>
{% endblock %}
