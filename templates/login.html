{% extends 'base.html' %}

{% block title %}Login - Roamly{% endblock %}

{% block content %}
<div class="card" style="max-width: 460px; margin: 40px auto;">
    <h2>Account Login</h2>
    <p class="section-desc">Sign in with your Customer, Administrator, or Travel Agency credentials.</p>

    <form action="{{ url_for('auth.login') }}" method="POST">
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" placeholder="Enter username (e.g. admin or customer)" required autofocus>
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="Enter password" required>
        </div>

        <button type="submit" class="btn block-btn mt-15">Log In</button>
    </form>

    <div class="auth-footer mt-20">
        <p>Don't have an account? <a href="{{ url_for('auth.signup') }}">Sign Up here</a></p>
    </div>

    <hr class="voucher-divider mt-20">

    <div class="portal-quick-links mt-15">
        <small class="text-muted">Dedicated Portals:</small>
        <div class="mt-5" style="font-size: 13px;">
            <a href="/admin/login" style="color: #0284c7; text-decoration: none; font-weight: 600;">Main Admin Console</a> • 
            <a href="/agency/login" style="color: #0284c7; text-decoration: none; font-weight: 600;">Travel Agency Portal</a>
        </div>
    </div>
</div>
{% endblock %}
