<!-- Interactive Leaflet Geolocation Map Component (Stitch Inked Theme) -->
<div class="card mt-25" style="padding:22px;">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 12px; flex-wrap:wrap; gap:10px; border-bottom:2px solid #000; padding-bottom:10px;">
        <div style="display:flex; align-items:center; gap:8px;">
            <span class="material-symbols-outlined" style="font-size:22px;">explore</span>
            <h3 style="margin:0; font-size:18px; font-family:'Space Grotesk',sans-serif; text-transform:uppercase;">Geolocation &amp; Cartography Map</h3>
        </div>
        <span class="badge badge-yellow">GPS COORDINATES</span>
    </div>
    <p style="color:var(--text-secondary); font-size:13.5px; margin:0 0 16px;">
        Explore the charted territory, surrounding landmarks, and transit access points.
    </p>
    <div id="interactive-map" class="leaflet-map-container" style="height:340px; border-radius:4px; border:2px solid #000; box-shadow:4px 4px 0px #000;"></div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        var defaultLat = {{ map_lat|default(11.4102) }};
        var defaultLng = {{ map_lng|default(76.6950) }};
        var locationTitle = "{{ map_title|default('Destination') }}";
        
        var map = L.map('interactive-map').setView([defaultLat, defaultLng], 12);
        
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 18,
            attribution: '&copy; OpenStreetMap &bull; Voyage Ink'
        }).addTo(map);
        
        var customIcon = L.divIcon({
            className: 'custom-map-pin',
            html: '<div style="background-color:#000; color:#fef08a; width:30px; height:30px; border-radius:4px; display:flex; align-items:center; justify-content:center; border:2px solid #000; box-shadow:2px 2px 0px #000; font-weight:800; font-family:sans-serif; font-size:13px;">★</div>',
            iconSize: [30, 30],
            iconAnchor: [15, 15]
        });
        
        var marker = L.marker([defaultLat, defaultLng], {icon: customIcon}).addTo(map);
        marker.bindPopup('<div style="font-family:\'Space Grotesk\',sans-serif; padding:4px;"><strong>' + locationTitle + '</strong><br><small style="color:#47464a; font-weight:700;">OFFICIALLY CHARTED</small></div>').openPopup();
    });
</script>
