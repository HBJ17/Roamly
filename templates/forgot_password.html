{% extends 'base.html' %}

{% block title %}Forgot Password - Roamly{% endblock %}

{% block content %}
<div class="card reveal-scroll" style="max-width: 480px; margin: 40px auto; padding:36px; border: 3px solid #000; box-shadow: 8px 8px 0px #000;">
    <div style="text-align:center; margin-bottom:24px;">
        <span class="badge badge-yellow" style="margin-bottom:8px; transform:rotate(-1.5deg);">PASSWORD RECOVERY</span>
        <h2 style="font-size:24px; margin:4px 0 6px;">Reset Your Passcode</h2>
        <p style="color:var(--text-secondary); font-size:13.5px; margin:0;">Enter your registered account email and we'll generate a secure password reset link.</p>
    </div>

    <form action="{{ url_for('auth.forgot_password') }}" method="POST">
        <div class="form-group mb-20">
            <label class="form-label" for="email">Registered Email Address</label>
            <input type="email" id="email" name="email" class="form-control" placeholder="e.g. traveler@roamly.com" required autofocus>
        </div>

        <button type="submit" class="btn btn-primary" style="width:100%; padding:12px; font-size:14px;">
            Send Reset Instructions →
        </button>
    </form>

    <div style="text-align:center; margin-top:20px; font-size:13.5px;">
        <p style="margin:0; color:var(--text-secondary);">Remembered your password? <a href="{{ url_for('auth.login') }}" style="color:#000; font-weight:800; text-decoration:underline;">Back to Sign In</a></p>
    </div>
</div>
{% endblock %}
