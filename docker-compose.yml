services:
  # MongoDB Database Service
  mongo:
    image: mongo:7.0
    container_name: roamly_mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Express REST API Server
  server:
    build: ./server
    container_name: roamly_server
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGO_URI=mongodb://mongo:27017/roamly_db
      - JWT_SECRET=roamly_jwt_super_secret_key_2026_expedition_co
      - CLIENT_URL=http://localhost
    depends_on:
      mongo:
        condition: service_healthy

  # React Single Page App (Vite + Nginx)
  client:
    build: ./client
    container_name: roamly_client
    restart: always
    ports:
      - "80:80"
      - "5173:80"
    depends_on:
      - server

volumes:
  mongo_data:
